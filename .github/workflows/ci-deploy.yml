name: CI e Deploy

# A cada push na main: roda os testes e, se passarem, publica automaticamente.
#  • Cloudflare Workers (site + API, plano gratuito) — exige os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID
#  • GitHub Pages (site estático, modo "chave própria") — não exige secrets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Instala Chromium (E2E)
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        run: npm run test:e2e

  deploy-cloudflare:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verifica credenciais
        id: creds
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy Cloudflare ignorado::Defina os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (veja docs/DEPLOY.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Deploy no Cloudflare Workers
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      API_BASE: ${{ vars.ESCRIBA_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Injeta a URL da API (opcional) em config.js
        run: |
          node -e "require('fs').writeFileSync('public/config.js', 'window.ESCRIBA_CONFIG = ' + JSON.stringify({ apiBase: (process.env.API_BASE || '').replace(/\/+\$/, '') }) + ';\n')"
          cat public/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
